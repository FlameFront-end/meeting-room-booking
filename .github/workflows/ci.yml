name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет устаревший прогон
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Types, lint, format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Stylelint
        run: npm run lint:styles
      - name: Prettier
        run: npm run format:check

  unit:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Vitest
        run: npm run test:coverage

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'app/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Next build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next/
            !.next/cache/
          include-hidden-files: true
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright
        run: npm run test:e2e

      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── CD ─────────────────────────────────────────────────────────────────────
  # Деплой на Vercel только после зелёного CI. Нужны секреты репозитория:
  # VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (см. README → «Деплой»).
  # Без секретов шаги деплоя пропускаются, а не падают.

  deploy-preview:
    name: Deploy preview
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [quality, unit, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Skip without Vercel secrets
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN не задан — деплой пропущен"

      - uses: actions/checkout@v7
        if: env.VERCEL_TOKEN != ''
      - uses: ./.github/actions/setup
        if: env.VERCEL_TOKEN != ''

      - name: Build & deploy
        id: deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel@65.4.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx vercel@65.4.0 build --token="$VERCEL_TOKEN"
          url=$(npx vercel@65.4.0 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: env.VERCEL_TOKEN != ''
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->'
            const body = `${marker}\n🔍 Preview: ${process.env.PREVIEW_URL}\n\nКоммит: ${context.payload.pull_request.head.sha.slice(0, 7)}`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find(comment => comment.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, unit, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Skip without Vercel secrets
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN не задан — деплой пропущен"

      - uses: actions/checkout@v7
        if: env.VERCEL_TOKEN != ''
      - uses: ./.github/actions/setup
        if: env.VERCEL_TOKEN != ''

      - name: Build & deploy
        id: deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel@65.4.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@65.4.0 build --prod --token="$VERCEL_TOKEN"
          url=$(npx vercel@65.4.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Production: $url" >> "$GITHUB_STEP_SUMMARY"
